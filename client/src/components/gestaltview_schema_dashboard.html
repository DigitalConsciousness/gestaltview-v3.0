.tlist{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.trow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;background:#f8f7f4;border:0.5px solid #e1e0d9}
.trow.tlit{border-left:3px solid #1baf7a}

.badge-vec{font-size:10px;padding:1px 6px;border-radius:4px;background:#dbe9fb;color:#0c447c;font-weight:500}
.bar-section{margin-top:1rem}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.bar-label{font-size:12px;color:#52514e;width:140px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.bar-track{flex:1;background:#e1e0d9;border-radius:4px;height:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}

let filter='all', selectedDomain=null;
function setFilter(f,el){filter=f;document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');renderGrid();renderDetail();}
function getDomains(){const m={};DATA.forEach(r=>{if(!m[r.domain])m[r.domain]=[];m[r.domain].push(r);});return m;}
function filterRows(rows){if(filter==='lit')return rows.filter(r=>r.lit);if(filter==='dark')return rows.filter(r=>!r.lit);if(filter==='vector')return rows.filter(r=>VEC_TABLES.has(r.table));return rows;}
function renderGrid(){const map=getDomains();const grid=document.getElementById('domain-grid');grid.innerHTML='';Object.keys(map).forEach(domain=>{const rows=map[domain];const filtered=filterRows(rows);if(!filtered.length)return;const div=document.createElement('div');div.className='dcard'+(selectedDomain===domain?' selected':'');div.onclick=()=>{selectedDomain=selectedDomain===domain?null:domain;renderGrid();renderDetail();};div.innerHTML=`<div class="dcard-header"><span class="dcard-name">${domain}</span><span class="dcard-count">${filtered.length}/${rows.length}</span></div><div class="dot-row">${rows.map(r=>`<div class="dot ${r.lit?'lit':'dark'}" title="${r.table}: ${r.rows} rows"></div>`).join('')}</div>`;grid.appendChild(div);});}
function renderDetail(){const panel=document.getElementById('detail-panel');if(!selectedDomain){panel.innerHTML='<div style="color:#898781;font-size:13px;padding:.5rem 0">Click a domain card to inspect its tables.</div>';return;}const map=getDomains();const rows=filterRows(map[selectedDomain]);const allRows=map[selectedDomain];const litN=allRows.filter(r=>r.lit).length;const totalCols=allRows.reduce((a,r)=>a+r.cols,0);const totalIdx=allRows.reduce((a,r)=>a+r.indexes,0);panel.innerHTML=`<div class="detail-title"><span>${selectedDomain}</span><span style="font-size:11px;background:${litN>0?'#d4f5e9':'#f8f7f4'};color:${litN>0?'#0a5c42':'#898781'};padding:2px 8px;border-radius:4px">${litN}/${allRows.length} lit</span><span style="font-size:11px;color:#898781">${totalCols} cols · ${totalIdx} indexes</span></div><div class="tlist">${rows.map(r=>`<div class="trow ${r.lit?'tlit':'tdark'}"><span class="tname" title="${r.table}">${r.table}</span><span class="tmeta">${r.lit?`<span class="badge-rows">${r.rows}r</span>`:''} ${VEC_TABLES.has(r.table)?`<span class="badge-vec">vec</span>`:''}<span style="font-size:11px;color:#898781">${r.cols}c</span></span></div>`).join('')}</div>`;}
function renderBars(){const map=getDomains();const bc=document.getElementById('bar-chart');const sorted=Object.keys(map).sort((a,b)=>{const la=map[a].filter(r=>r.lit).length/map[a].length;const lb=map[b].filter(r=>r.lit).length/map[b].length;return lb-la;});bc.innerHTML=sorted.map(d=>{const rows=map[d];const lit=rows.filter(r=>r.lit).length;const pct=Math.round(lit/rows.length*100);return`<div class="bar-row"><span class="bar-label" title="${d}">${d}</span><div class="bar-track"><div class="bar-fill ${pct>0?'blit':'bdark'}" style="width:${Math.max(pct,2)}%"></div></div><span class="bar-pct">${pct}%</span></div>`;}).join('');}
const schemaAlert = document.getElementById('schema-alert');
const schemaSubtitle = document.getElementById('schema-subtitle');
const statPublicTables = document.getElementById('stat-public-tables');
const statLitTables = document.getElementById('stat-lit-tables');
const statDarkTables = document.getElementById('stat-dark-tables');
const statVectorIndexes = document.getElementById('stat-vector-indexes');
const statEnumTypes = document.getElementById('stat-enum-types');

function setAlert(message, visible = true){
  if(!schemaAlert) return;
  schemaAlert.style.display = visible ? 'block' : 'none';
  schemaAlert.textContent = message;
}

function updateSummary(summary, generatedAt){
  if(statPublicTables) statPublicTables.textContent = String(summary?.public_tables ?? DATA.length);
  if(statLitTables) statLitTables.textContent = String(summary?.lit_tables ?? DATA.filter(r => r.lit).length);
  if(statDarkTables) statDarkTables.textContent = String(summary?.dark_tables ?? DATA.filter(r => !r.lit).length);
  if(statVectorIndexes) statVectorIndexes.textContent = String(summary?.vector_tables ?? DATA.filter(r => VEC_TABLES.has(r.table)).length);
  if(statEnumTypes) statEnumTypes.textContent = String(summary?.enum_types ?? 0);
  if(schemaSubtitle) {
    schemaSubtitle.textContent = generatedAt
      ? `Live snapshot refreshed ${new Date(generatedAt).toLocaleString()} · project dzrxepbgetinldcknior`
      : 'Live snapshot from the current Supabase project · project dzrxepbgetinldcknior';
  }
}

function mergeLiveRows(rows){
  if(!Array.isArray(rows) || rows.length === 0) return;
  const liveByTable = new Map(rows.map((row) => [row.table_name, row]));
  DATA.forEach((row) => {
    const live = liveByTable.get(row.table);
    if(!live) return;
    row.rows = Number(live.row_count) || 0;
    row.cols = Number(live.column_count) || 0;
    row.fks = Number(live.foreign_key_count) || 0;
    row.indexes = Number(live.index_count) || 0;
    row.lit = Boolean(live.has_rows);
  });
  VEC_TABLES.clear();
  rows.forEach((row) => {
    if(row.has_vector_index) {
      VEC_TABLES.add(row.table_name);
    }
  });
}

async function loadLiveSnapshot(){
  try {
    const response = await fetch('/api/schema/dashboard', {
      credentials: 'include',
      headers: {
        Accept: 'application/json',
      },
    });
    if(!response.ok){
      throw new Error(`HTTP ${response.status}`);
    }
    const payload = await response.json();
    mergeLiveRows(payload.tables);
    updateSummary(payload.summary, payload.generated_at);
    setAlert('Live schema snapshot loaded successfully.', false);
    renderGrid();
    renderDetail();
    renderBars();
  } catch (error) {
    setAlert(`Live schema snapshot unavailable, showing the embedded fallback data instead. ${error instanceof Error ? error.message : String(error)}`);
    updateSummary(null, null);
  }
}

renderGrid();
renderBars();
void loadLiveSnapshot();
</script>
</body>
</html>
