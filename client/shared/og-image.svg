<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GestaltView — Consciousness-Serving AI</title>
  <desc id="desc">Dark GestaltView Open Graph card with luminous cyan and violet identity marks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070B"/>
      <stop offset="0.5" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#1f1142"/>
    </linearGradient>
    <radialGradient id="cyan" cx="0.25" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#69E6EB" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#69E6EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.74" cy="0.4" r="0.48">
      <stop offset="0" stop-color="#BE84FF" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#BE84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="170" y1="230" x2="330" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#69E6EB"/>
      <stop offset="1" stop-color="#BE84FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#cyan)"/>
  <rect width="1200" height="630" fill="url(#violet)"/>
  <rect x="104" y="108" width="992" height="414" rx="40" fill="#080D18" fill-opacity="0.78" stroke="#69E6EB" stroke-opacity="0.65" stroke-width="3"/>
  <g filter="url(#glow)">
    <path d="M250 222L342 315L250 408L158 315Z" fill="none" stroke="url(#mark)" stroke-width="14" stroke-linejoin="round"/>
    <circle cx="250" cy="315" r="46" fill="none" stroke="#BE84FF" stroke-width="10"/>
    <circle cx="250" cy="315" r="18" fill="#69E6EB"/>
  </g>
  <text x="640" y="246" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" letter-spacing="-1.6">GestaltView</text>
  <text x="640" y="306" fill="#69E6EB" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700">Consciousness-Serving AI</text>
  <text x="640" y="362" fill="#BE84FF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="600">PLK • SymbioCoder • Billy • Multi-LLM routing</text>
  <text x="640" y="420" fill="#A8B3C7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Keith Soyka's human-centered AI platform and consulting practice.</text>
</svg>
