<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GestaltView — Ignition Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090910;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#hdr{padding:10px 14px 6px;display:flex;align-items:baseline;gap:10px;flex-shrink:0;border-bottom:1px solid #1e1e2e}
#ttl{font-size:14px;font-weight:600;color:#c7d2fe;letter-spacing:-.02em}
#sub{font-size:10px;color:#3d4566}
#ctrl{padding:6px 14px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;flex-shrink:0;border-bottom:1px solid #1e1e2e;min-height:36px}
.dp{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid;cursor:pointer;transition:opacity .15s;white-space:nowrap;user-select:none}
.dp.off{opacity:.25}
#litbtn{margin-left:auto;font-size:10px;padding:2px 9px;border-radius:6px;border:1px solid #2a2a3f;background:#111120;color:#64748b;cursor:pointer;flex-shrink:0}
#litbtn.on{background:#0a2a12;color:#4ade80;border-color:#1a4a22}
#srch{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid #2a2a3f;background:#111120;color:#e2e8f0;width:130px}
#srch::placeholder{color:#334155}
#gwrap{flex:1;overflow-x:auto;overflow-y:hidden;position:relative}
svg{display:block}
#tip{position:fixed;background:#0d0d1a;border:1px solid #2a2a40;border-radius:8px;padding:9px 13px;font-size:11px;pointer-events:none;z-index:999;display:none;max-width:210px;box-shadow:0 8px 32px rgba(0,0,0,.7)}
.tn{font-size:11px;font-weight:700;font-family:monospace;margin-bottom:5px;word-break:break-all}
.tr{font-size:10px;color:#475569;margin-bottom:1px;display:flex;justify-content:space-between;gap:10px}
.tr span:last-child{color:#64748b}
.tbadge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600;margin-top:4px}
#leg{padding:5px 14px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid #1e1e2e;flex-shrink:0}
.li{display:flex;align-items:center;gap:3px;font-size:9px;color:#334155;cursor:pointer}
.li:hover{color:#64748b}
.ld{width:7px;height:7px;border-radius:50%;flex-shrink:0}
@keyframes pulse{0%,100%{r:0;opacity:.6}50%{r:14;opacity:0}}
.glow-ring{animation:pulse 2.5s ease-in-out infinite}
</style>
</head>
<body>

<div id="hdr">
  <span id="ttl">⚡ GestaltView — Ignition Map</span>
  <span id="sub">180 tables · 5 seeding waves · 166 FK chains · live rebuild · dzrxepbgetinldcknior</span>
</div>

<div id="ctrl">

<div id="gwrap">

</div>

<div id="tip"></div>

// ─── Layout constants ─────────────────────────────────────────────────────────
const WAVE_Y  = [78, 188, 290, 362, 460];
const BAND_H  = 90;
const SVG_W   = 1400;
const SVG_H   = 530;
const XPAD    = 50;

// Sort nodes within each wave by domain (visual clustering)
const byWave = [1,2,3,4,5].map(w =>
  G.nodes.filter(n => n.wave === w).sort((a,b) => a.domain.localeCompare(b.domain))
);

// Assign deterministic X positions within each wave lane
const pos = {};
byWave.forEach((wNodes, wi) => {
  const span = SVG_W - XPAD * 2;
  wNodes.forEach((n, i) => {
    const x = wNodes.length === 1
      ? SVG_W / 2
      : XPAD + (i / (wNodes.length - 1)) * span;
    pos[n.id] = { x, y: WAVE_Y[wi] };
  });
});

// Node radius scales with how many tables this one unlocks
const rScale = n => Math.max(4, Math.min(12, 4 + n.unlocks * 0.45));

// ─── Build SVG ───────────────────────────────────────────────────────────────
const svg = document.getElementById('graph');
svg.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);
svg.setAttribute('width',  SVG_W);
svg.setAttribute('height', SVG_H);
svg.style.background = '#090910';

// Filter defs (glow effects)
const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
defs.innerHTML = `
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#1e293b"/>
  </marker>
`;
svg.appendChild(defs);

// Wave bands (background stripes)
const bandsG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
WAVE_Y.forEach((cy, i) => {
  const by = cy - BAND_H / 2 + 2;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', 0); rect.setAttribute('y', by);
  rect.setAttribute('width', SVG_W); rect.setAttribute('height', BAND_H - 4);
  rect.setAttribute('fill', i % 2 === 0 ? '#0d0d18' : '#0b0b15');
  bandsG.appendChild(rect);

  // Wave number label
  const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  lbl.setAttribute('x', 8); lbl.setAttribute('y', by + 13);
  lbl.setAttribute('fill', '#1e293b'); lbl.setAttribute('font-size', '9');
  lbl.setAttribute('font-family', 'monospace');
  lbl.textContent = `W${i + 1}`;
  bandsG.appendChild(lbl);

  // Node count per wave
  const cnt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  cnt.setAttribute('x', 8); cnt.setAttribute('y', by + 24);
  cnt.setAttribute('fill', '#1a2035'); cnt.setAttribute('font-size', '8');
  cnt.setAttribute('font-family', 'monospace');
  cnt.textContent = `${byWave[i].length}`;
  bandsG.appendChild(cnt);
});
svg.appendChild(bandsG);

// FK links (bezier curves)
const linksG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
const linkEls = {};
G.links.forEach(l => {
  const s = pos[l.source], t = pos[l.target];
  if (!s || !t) return;
  const isCyclic = CYCLIC_PAIRS.has(`${l.source}-${l.target}`);
  const dy = t.y - s.y;
  const cx1 = s.x + (t.x - s.x) * 0.25, cy1 = s.y + dy * 0.5;
  const cx2 = s.x + (t.x - s.x) * 0.75, cy2 = t.y - dy * 0.5;
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', `M${s.x},${s.y} C${cx1},${cy1} ${cx2},${cy2} ${t.x},${t.y}`);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke',       isCyclic ? '#7c3aed' : '#1e2d45');
  path.setAttribute('stroke-width', isCyclic ? '1.5'     : '0.8');
  path.setAttribute('opacity',      isCyclic ? '0.8'     : '0.5');
  path.setAttribute('marker-end', 'url(#arr)');
  linkEls[`${l.source}-${l.target}`] = path;
  linksG.appendChild(path);
});
svg.appendChild(linksG);

// Nodes
const nodesG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
const nodeEls = {};
G.nodes.forEach(n => {
  const p = pos[n.id];
  if (!p) return;
  const col = DC[n.domain] || '#4b5563';
  const r   = rScale(n);
  const g   = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('transform', `translate(${p.x},${p.y})`);
  g.style.cursor = 'pointer';
  g.dataset.id   = n.id;

  if (n.lit) {
    // Animated pulse ring for lit nodes
    const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    ring.setAttribute('cx', 0); ring.setAttribute('cy', 0); ring.setAttribute('r', r + 2);
    ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', col);
    ring.setAttribute('stroke-width', '1.5'); ring.setAttribute('opacity', '0');
    ring.classList.add('glow-ring');
    ring.style.animationDelay = `${Math.random() * 2}s`;
    g.appendChild(ring);
    // Soft glow halo
    const halo = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    halo.setAttribute('cx', 0); halo.setAttribute('cy', 0); halo.setAttribute('r', r + 4);
    halo.setAttribute('fill', col); halo.setAttribute('opacity', '0.15');
    g.appendChild(halo);
  }

  // Main circle
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', 0); c.setAttribute('cy', 0); c.setAttribute('r', r);
  c.setAttribute('fill',         n.lit ? col : '#0d0d1a');
  c.setAttribute('stroke',       col);
  c.setAttribute('stroke-width', n.lit ? '0' : '1.2');
  c.setAttribute('opacity',      n.lit ? '1' : '0.45');
  if (n.lit) c.setAttribute('filter', 'url(#glow)');
  g.appendChild(c);

  // Centre dot for high-influence nodes (unlocks >= 10)
  if (n.unlocks >= 10) {
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', 0); dot.setAttribute('cy', 0); dot.setAttribute('r', 2);
    dot.setAttribute('fill', n.lit ? '#fff' : col); dot.setAttribute('opacity', '0.9');
    g.appendChild(dot);
  }

  g.addEventListener('mouseenter', e => showTip(e, n, col));
  g.addEventListener('mousemove',  e => moveTip(e));
  g.addEventListener('mouseleave', () => hideTip());
  g.addEventListener('click',      () => selectNode(n.id));

  nodeEls[n.id] = g;
  nodesG.appendChild(g);
});
svg.appendChild(nodesG);

// ─── Tooltip ─────────────────────────────────────────────────────────────────
const tip = document.getElementById('tip');
function showTip(e, n, col) {
  const deps  = G.links.filter(l => l.target === n.id).map(l => G.nodes.find(x => x.id === l.source)?.name).filter(Boolean);
  tip.innerHTML = `
    <div class="tn" style="color:${col}">${n.name}</div>
    <div class="tr"><span>domain</span><span>${n.domain}</span></div>
    <div class="tr"><span>wave</span><span>${n.wave} — ${WAVE_LABELS[n.wave-1].split(' — ')[1]}</span></div>
    <div class="tr"><span>rows</span><span>${n.rows}</span></div>
    <div class="tr"><span>depends on</span><span>${n.depends} table${n.depends!==1?'s':''}</span></div>
    <div class="tr"><span>unlocks</span><span>${n.unlocks} table${n.unlocks!==1?'s':''}</span></div>
    ${n.lit
      ? `<span class="tbadge" style="background:${col}22;color:${col}">● LIT — ${n.rows} row${n.rows!==1?'s':''}</span>`
      : `<span class="tbadge" style="background:#1e293b;color:#475569">○ dark</span>`}
    ${deps.length ? `<div style="margin-top:5px;font-size:9px;color:#334155">deps: ${deps.slice(0,4).join(', ')}${deps.length>4?'…':''}</div>` : ''}
  `;
  tip.style.display = 'block';
  tip.style.left = (e.clientX + 14) + 'px';
  tip.style.top  = (e.clientY - 10) + 'px';
}
function moveTip(e) {
  tip.style.left = (e.clientX + 14) + 'px';
  tip.style.top  = (e.clientY - 10) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

// ─── Node selection (FK neighbourhood highlight) ──────────────────────────────
let selected = null;
function selectNode(id) {
  if (selected === id) { selected = null; resetHighlight(); return; }
  selected = id;
  const connected = new Set([id]);
  G.links.forEach(l => {
    if (l.source === id) connected.add(l.target);
    if (l.target === id) connected.add(l.source);
  });
  Object.entries(nodeEls).forEach(([nid, el]) => {
    el.style.opacity = connected.has(+nid) ? '1' : '0.06';
  });
  Object.entries(linkEls).forEach(([k, el]) => {
    const [s, t] = k.split('-').map(Number);
    const active = s === id || t === id;
    el.style.opacity = active ? '1' : '0.02';
    el.setAttribute('stroke',       active ? '#60a5fa' : '#1e2d45');
    el.setAttribute('stroke-width', active ? '1.5'     : '0.8');
  });
}
function resetHighlight() {
  Object.values(nodeEls).forEach(el => el.style.opacity = '1');
  Object.entries(linkEls).forEach(([k, el]) => {
    const isCyclic = CYCLIC_PAIRS.has(k);
    el.style.opacity      = isCyclic ? '0.8' : '0.5';
    el.setAttribute('stroke',       isCyclic ? '#7c3aed' : '#1e2d45');
    el.setAttribute('stroke-width', isCyclic ? '1.5'     : '0.8');
  });
}

// ─── Controls: domain filter pills ───────────────────────────────────────────
const ctrl          = document.getElementById('ctrl');
const domainFilter  = new Set(Object.keys(DC));
let   litOnly       = false;
let   searchQ       = '';

Object.entries(DC).forEach(([d, col]) => {
  const pill = document.createElement('div');
  pill.className    = 'dp';
  pill.textContent  = d;
  pill.dataset.domain = d;
  pill.style.borderColor = col + '55';
  pill.style.color       = col;
  pill.style.background  = col + '15';
  pill.addEventListener('click', () => {
    if (domainFilter.has(d)) domainFilter.delete(d); else domainFilter.add(d);
    pill.classList.toggle('off', !domainFilter.has(d));
    applyFilters();
  });
  ctrl.insertBefore(pill, document.getElementById('litbtn'));
});

document.getElementById('litbtn').addEventListener('click', function () {
  litOnly = !litOnly;
  this.classList.toggle('on', litOnly);
  applyFilters();
});

document.getElementById('srch').addEventListener('input', function () {
  searchQ = this.value.toLowerCase().trim();
  applyFilters();
});

function applyFilters() {
  G.nodes.forEach(n => {
    const el = nodeEls[n.id]; if (!el) return;
    const show = domainFilter.has(n.domain)
              && (!litOnly  || n.lit)
              && (!searchQ  || n.name.includes(searchQ) || n.domain.toLowerCase().includes(searchQ));
    el.style.opacity = show ? '1' : '0.04';
  });
  G.links.forEach(l => {
    const le = linkEls[`${l.source}-${l.target}`]; if (!le) return;
    const sVis = nodeEls[l.source] && parseFloat(nodeEls[l.source].style.opacity || 1) > 0.05;
    const tVis = nodeEls[l.target] && parseFloat(nodeEls[l.target].style.opacity || 1) > 0.05;
    le.style.opacity = (sVis && tVis) ? '0.5' : '0.02';
  });
}

// ─── Legend ───────────────────────────────────────────────────────────────────
const legDiv = document.getElementById('leg');
Object.entries(DC).forEach(([d, col]) => {
  const li = document.createElement('div');
  li.className = 'li';
  li.innerHTML = `<div class="ld" style="background:${col}"></div>${d}`;
  li.title = 'Click to toggle domain';
  li.addEventListener('click', () => {
    const pill = ctrl.querySelector(`[data-domain="${d}"]`);
    if (pill) pill.click();
  });
  legDiv.appendChild(li);
});
</script>
