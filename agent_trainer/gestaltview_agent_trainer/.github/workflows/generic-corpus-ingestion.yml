name: Generic Corpus Ingestion

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "Vector backend to scaffold for"
        required: true
        default: "supabase"
        type: choice
        options:
          - supabase
          - redis
      repo_root:
        description: "Relative path to corpus root"
        required: false
        default: "."
      output:
        description: "Output artifact path"
        required: false
        default: "artifacts/ingestion/payload.json"

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      GV_VECTOR_BACKEND: ${{ github.event.inputs.backend }}
      GV_REDIS_INDEX: ${{ vars.GV_REDIS_INDEX || 'gv_knowledge' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run generic ingestion scaffold
        run: |
          python agent_trainer/gv_operator_kit/scripts/ingest_generic_corpus.py \
            --repo-root "${{ github.event.inputs.repo_root || '.' }}" \
            --backend "${{ github.event.inputs.backend || 'supabase' }}" \
            --output "${{ github.event.inputs.output || 'artifacts/ingestion/payload.json' }}"

      - name: Upload ingestion artifact
        uses: actions/upload-artifact@v4
        with:
          name: corpus-ingestion-${{ github.run_number }}
          path: ${{ github.event.inputs.output || 'artifacts/ingestion/payload.json' }}
          if-no-files-found: error
