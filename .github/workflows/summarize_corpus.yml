name: Summarize and Annotate Corpus

on:
  workflow_dispatch:
    inputs:
      source_prefix:
        description: "Filter knowledge_fragments by source_file prefix (e.g. corpus_files, agent_trainer — leave blank for all)"
        required: false
        default: ""
        type: string
      package:
        description: "Filter knowledge_fragments by package tag (leave blank for all)"
        required: false
        default: ""
        type: string
      llm_model:
        description: "LLM model for summarization"
        required: false
        default: "gemini-2.0-flash"
        type: string
      batch_size:
        description: "Number of fragments to summarize per LLM batch"
        required: false
        default: "20"
        type: string
      dry_run:
        description: "Preview what would be summarized without writing annotations back to Supabase"
        required: true
        default: true
        type: boolean
      target_environment:
        description: "GitHub Environment containing live Supabase + LLM secrets (must match Settings > Environments exactly — case-sensitive)"
        required: true
        default: "Production"
        type: environment

jobs:
  summarize:
    name: Summarize and Annotate Corpus
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.VITE_GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.VITE_OPENAI_API_KEY }}
      LLM_MODEL: ${{ inputs.llm_model }}
      SUMMARIZE_BATCH_SIZE: ${{ inputs.batch_size }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: summarize-${{ runner.os }}-${{ hashFiles('scripts/synthesize_corpus.py') }}
          restore-keys: |
            summarize-${{ runner.os }}-

      - name: Install summarization dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install psycopg2-binary requests python-dotenv openai google-generativeai

      - name: Preflight — verify secrets are bound
        run: |
          echo "SUPABASE_URL set: $([[ -n "${SUPABASE_URL:-${VITE_SUPABASE_URL:-}}" ]] && echo YES || echo NO)"
          echo "SERVICE_KEY set:  $([[ -n "${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_KEY:-}}" ]] && echo YES || echo NO)"
          echo "LLM key set:      $([[ -n "${GEMINI_API_KEY:-${OPENAI_API_KEY:-}}" ]] && echo YES || echo NO)"

          if [[ -z "${SUPABASE_URL:-${VITE_SUPABASE_URL:-}}" || -z "${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_KEY:-}}" ]]; then
            echo ""
            echo "::error::Secrets are empty. Verify:"
            echo "::error::  1. Environment name '${{ inputs.target_environment }}' matches GitHub Settings > Environments exactly (case-sensitive)"
            echo "::error::  2. SUPABASE_URL (or VITE_SUPABASE_URL) and SUPABASE_SERVICE_ROLE_KEY (or SUPABASE_SERVICE_KEY) exist in that environment"
            echo "::error::  3. This workflow has type: environment (not type: string) on the target_environment input"
            exit 1
          fi

          if [[ -z "${GEMINI_API_KEY:-}" && -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::Requires at least one LLM key: GEMINI_API_KEY or OPENAI_API_KEY in environment '${{ inputs.target_environment }}'"
            exit 1
          fi

      - name: Run Manifest Synthesis and Loom Annotation
        run: |
          args=()

          if [[ -n "${{ inputs.source_prefix }}" ]]; then
            args+=(--source-prefix "${{ inputs.source_prefix }}")
          fi

          if [[ -n "${{ inputs.package }}" ]]; then
            args+=(--package "${{ inputs.package }}")
          fi

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi

          python scripts/synthesize_corpus.py "${args[@]}"

      - name: Upload manifest artifact
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: manifest-index-${{ github.run_id }}
          path: manifest_index.json
          retention-days: 30
