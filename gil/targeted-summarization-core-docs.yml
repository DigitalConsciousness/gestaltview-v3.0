version: "1.0"

defaults:
  gil_protocol: "gil/rough-draft-ratification.yaml"
  source_prefix: "docs"
  package: "core-docs"
  batch_size: 2
  dry_run: false
  max_fragments: null

results_dir: "targeted_summaries/core-docs"

runs:
  - label: "core-docs-10m"
    time_budget_minutes: 10
    manifest_out: "targeted_summaries/core-docs/core-docs-10m.json"

  - label: "core-docs-20m"
    time_budget_minutes: 20
    manifest_out: "targeted_summaries/core-docs/core-docs-20m.json"

  - label: "core-docs-30m"
    time_budget_minutes: 30
    manifest_out: "targeted_summaries/core-docs/core-docs-30m.json"
