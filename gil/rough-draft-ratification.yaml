  who: "GestaltView governance layer and founder context"
  what: "Lock in the rule that rough drafts must be safely preserved as protected objects before they are polished or ratified."
  where: "GestaltView doctrine layer, canonical docs, and intent handling surfaces"
  when: "immediate"
  why: "Rough draft thinking is valuable, but unratified ideas can disappear or masquerade as completed decisions."
  how: "Create a doctrine candidate, preserve it in a canonical location, and require explicit ratification before enforcement."
  summary: "Protected rough drafts are canonical candidates, not disposable thoughts."
  narrative: |
    This intent formalizes the rule that when something feels important but is still in rough draft mode,
    it should be safely captured, labeled honestly, and held as a doctrine candidate until it is reviewed.
    The goal is to preserve the draft without pretending it has been fully ratified.
  priority: "high"
  timeHorizon: "long_term"
  rawText: |
    Secure even the rough draft, so it exists and is safe. Then perfect it later.
  bucketDropId: "bd-2026-04-24T17-57-10Z"

