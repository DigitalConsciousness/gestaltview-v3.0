version: "1.0"

defaults:
  gil_protocol: "gil/rough-draft-ratification.yaml"
  source_prefix: "docs"
  batch_size: 2
  dry_run: false
  package: null
  max_fragments: null

results_dir: "targeted_summaries"

runs:
  - label: "docs-10m"
    time_budget_minutes: 10
    manifest_out: "targeted_summaries/docs-10m.json"

  - label: "docs-20m"
    time_budget_minutes: 20
    manifest_out: "targeted_summaries/docs-20m.json"

  - label: "docs-30m"
    time_budget_minutes: 30
    manifest_out: "targeted_summaries/docs-30m.json"
