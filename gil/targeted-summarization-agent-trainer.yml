version: "1.0"

defaults:
  gil_protocol: "gil/rough-draft-ratification.yaml"
  source_prefix: "agent_trainer"
  package: "agent_trainer"
  batch_size: 2
  dry_run: false
  max_fragments: null

results_dir: "targeted_summaries/agent-trainer"

runs:
  - label: "agent-trainer-10m"
    time_budget_minutes: 10
    manifest_out: "targeted_summaries/agent-trainer/agent-trainer-10m.json"

  - label: "agent-trainer-20m"
    time_budget_minutes: 20
    manifest_out: "targeted_summaries/agent-trainer/agent-trainer-20m.json"

  - label: "agent-trainer-30m"
    time_budget_minutes: 30
    manifest_out: "targeted_summaries/agent-trainer/agent-trainer-30m.json"
